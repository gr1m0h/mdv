version: 2

before:
  hooks:
    # mermaid is vendored by the release workflow step before goreleaser runs.
    - go mod tidy

builds:
  - id: mdv
    main: .
    binary: mdv
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: mdv
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_LICENSES.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
