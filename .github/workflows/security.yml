# <target-repo>/.github/workflows/security.yml
name: security
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  govulncheck:
    uses: gr1m0h/.github/.github/workflows/govulncheck.yml@e2f419f7447a4d7d9b0981a03c02025f5f73d038
  osv-scan:
    uses: gr1m0h/.github/.github/workflows/osv-scanner.yml@e2f419f7447a4d7d9b0981a03c02025f5f73d038
    permissions:
      contents: read
      security-events: write
  gitleaks:
    uses: gr1m0h/.github/.github/workflows/gitleaks.yml@e2f419f7447a4d7d9b0981a03c02025f5f73d038
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: gr1m0h/.github/.github/workflows/dependency-review.yml@e2f419f7447a4d7d9b0981a03c02025f5f73d038
    permissions:
      contents: read
      pull-requests: write
  codeql:
    uses: gr1m0h/.github/.github/workflows/codeql-go.yml@e2f419f7447a4d7d9b0981a03c02025f5f73d038
    permissions:
      contents: read
      security-events: write
      actions: read
  actionlint:
    uses: gr1m0h/.github/.github/workflows/actions-pin-lint.yml@e2f419f7447a4d7d9b0981a03c02025f5f73d038
