# <target-repo>/.github/workflows/security.yml
name: security
on:
  pull_request:
permissions:
  contents: read

jobs:
  govulncheck:
    uses: gr1m0h/.github/.github/workflows/govulncheck.yml@bfc0348f95a376b47e216b5136240e24d97dda8a
  osv-scan:
    uses: gr1m0h/.github/.github/workflows/osv-scanner.yml@bfc0348f95a376b47e216b5136240e24d97dda8a
    permissions:
      contents: read
      security-events: write
  gitleaks:
    uses: gr1m0h/.github/.github/workflows/gitleaks.yml@bfc0348f95a376b47e216b5136240e24d97dda8a
    permissions:
      contents: read
      pull-requests: read
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    uses: gr1m0h/.github/.github/workflows/dependency-review.yml@bfc0348f95a376b47e216b5136240e24d97dda8a
    permissions:
      contents: read
      pull-requests: read
  codeql:
    uses: gr1m0h/.github/.github/workflows/codeql-go.yml@bfc0348f95a376b47e216b5136240e24d97dda8a
    permissions:
      contents: read
      security-events: write
      actions: read
  actionlint:
    uses: gr1m0h/.github/.github/workflows/actions-pin-lint.yml@bfc0348f95a376b47e216b5136240e24d97dda8a
