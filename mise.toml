[tools]
go = "1.27.3"

[env]
# Pin the mermaid major line; vendor-mermaid resolves the exact patch version.
MERMAID_SPEC = "11"
STATIC = "internal/assets/static"

[tasks.build]
description = "Build the mdv binary"
run = '''
VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o mdv .
'''

[tasks.test]
description = "Run the test suite with the race detector"
run = "go test -race ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Fail if any Go file is not gofmt-clean"
run = '''
out=$(gofmt -l .)
if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
'''

[tasks.generate]
description = "Regenerate the chroma stylesheets"
run = "go generate ./..."

[tasks.check]
description = "Format check + vet + test"
depends = ["fmt", "vet", "test"]

[tasks.vendor-mermaid]
description = "Resolve and vendor a pinned Mermaid release with its license and checksum"
run = "go run ./scripts/vendor-mermaid"
